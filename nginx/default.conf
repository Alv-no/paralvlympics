# Allowlist of emails permitted to see the actual app. Everyone else -- including
# anonymous requests, where the header is absent entirely -- is redirected to the
# countdown page.
#
# X-Auth-Request-Email is set by the oauth2-proxy sitting in front of this
# container. Anything reaching nginx directly can set the header by hand, so this
# is a reveal gate, not a security boundary.
map $http_x_auth_request_email $plt_allowed {
    default               0;
    "~*^stian@alv\.no$"   1;
    "~*^olav@alv\.no$"    1;
    "~*^andreas@alv\.no$" 1;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Emit "Location: /countdown.html" rather than an absolute URL. nginx would
    # otherwise rebuild it from the scheme it sees locally (http) and drop the
    # port, sending users off the proxy's https origin.
    absolute_redirect off;

    # The countdown page and the assets it references are never gated.
    location = /countdown.html { }
    location = /favicon.ico    { }
    location /fonts/           { }

    location / {
        if ($plt_allowed = 0) {
            return 302 /countdown.html;
        }

        # SPA history fallback, so deep links and refreshes reach the router.
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { }
}
