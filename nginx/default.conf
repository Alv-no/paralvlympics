server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers. nginx would otherwise rebuild them from
    # the scheme it sees locally (http) and drop the port, sending users off the
    # proxy's https origin.
    absolute_redirect off;

    # Send anyone still holding a countdown link or an open tab to the app.
    # Without this the SPA fallback below serves index.html for a path the
    # router has no route for, which renders a blank page. 302 rather than 301
    # so browsers do not cache it permanently.
    location = /countdown.html {
        return 302 /;
    }

    location / {
        # SPA history fallback, so deep links and refreshes reach the router.
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { }
}
